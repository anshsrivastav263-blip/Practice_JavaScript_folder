<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100vh;
        }

        body {
            background-color: royalblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(400px, 90%);
            border: 10px solid white;
            border-radius: 18px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(18px);
            color: black;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.8);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: clamp(1rem, 5vw, 2rem);
        }

        .genpwd {
            width: 100%;
            outline: none;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid black;
            border-radius: 8px;
            font-size: 16px;
        }

        .types {
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px;
        }

        .choice {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .choice:last-child {
            margin-bottom: 0;
        }

        .choice input[type="range"] {
            width: 100%;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background-color: royalblue;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Generator</h1>

        <input
            type="text"
            class="genpwd"
            id="genpwd"
            readonly
            placeholder="Your password"
        >

        <div class="types">

            <!-- Password Length -->
            <div class="choice">

                <input
                    type="range"
                    id="range"
                    min="4"
                    max="30"
                    value="12"
                >

                <p>
                    Length:
                    <span id="length">12</span>
                </p>

            </div>

            <!-- Password Type -->
            <div class="choice">

                <p>Password Type:</p>

                <div class="radio-group">

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="passwordType"
                            id="alphabet"
                            checked
                        >
                        Alphabet
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="passwordType"
                            id="number"
                        >
                        Number
                    </label>

                </div>

            </div>

        </div>

        <button id="generate">
            Generate Password
        </button>

        <button id="copy">
            Copy Password
        </button>

    </div>


    <script>

        const genpwd = document.querySelector("#genpwd");
        const rangeInput = document.querySelector("#range");
        const numberInput = document.querySelector("#number");
        const alphabetInput = document.querySelector("#alphabet");
        const btn = document.querySelector("#generate");
        const copyBtn = document.querySelector("#copy");
        const showlength = document.querySelector("#length");


        // Slider की value शुरू में दिखाएं
        showlength.textContent = rangeInput.value;


        // Slider move होने पर length update करें
        rangeInput.addEventListener("input", () => {

            let length = Number(rangeInput.value);

            showlength.textContent = length;

        });


        // Generate Password
        btn.addEventListener("click", () => {

            const alphabet = "abcdefghijklmnopqrstuvwxyz";
            const numbers = "0123456789";

            let password = "";

            // Current slider value
            let length = Number(rangeInput.value);

            let characters = "";


            // अगर Alphabet selected है
            if (alphabetInput.checked) {

                characters = alphabet;

            }


            // अगर Number selected है
            if (numberInput.checked) {

                characters = numbers;

            }


            // Password generate करें
            for (let i = 0; i < length; i++) {

                let randomIndex =
                    Math.floor(Math.random() * characters.length);

                password += characters[randomIndex];

            }


            // Password input में दिखाएं
            genpwd.value = password;

        });


        // Copy Password
        copyBtn.addEventListener("click", async () => {

            if (genpwd.value === "") {

                alert("पहले password generate करें!");

                return;

            }

            await navigator.clipboard.writeText(genpwd.value);

            alert("Password copied!");

        });

    </script>

</body>

</html>
