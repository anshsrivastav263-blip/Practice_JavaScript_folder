<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comment Box</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: linear-gradient(135deg, black, #555);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 35px;

            border: 2px solid white;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.08);

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);

            backdrop-filter: blur(10px);
        }

        .input-box {
            position: relative;
            width: 100%;
        }

        .input-box textarea {
            width: 100%;
            min-height: 150px;

            padding: 20px;

            outline: none;
            resize: vertical;

            font-size: 18px;
            line-height: 1.5;
            font-family: inherit;

            color: white;

            background: transparent;

            border: 1px solid white;
            border-radius: 15px;

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);

            transition: 0.3s ease;
        }

        .input-box label {
            position: absolute;

            top: 20px;
            left: 20px;

            padding: 0 5px;

            color: white;
            font-size: 18px;

            pointer-events: none;

            transition: 0.3s ease;
        }

        .input-box textarea:focus + label,
        .input-box textarea:valid + label {
            top: -11px;
            left: 15px;

            font-size: 14px;

            background: #292929;
        }

        .input-box textarea:focus {
            border-color: white;

            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .input-box textarea {
                font-size: 16px;
            }

            .input-box label {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="input-box">

            <textarea
                id="comment"
                rows="5"
                maxlength="100"
                required
            ></textarea>

            <label for="comment">
                Comment here....
            </label>

        </div>

    </div>

    <script>
        const textarea = document.querySelector("#comment");
        const maxLength = 100;

        textarea.addEventListener("input", () => {

            if (textarea.value.length > maxLength) {

                textarea.value =
                    textarea.value.slice(0, maxLength);

                alert("You reached the maximum character limit!");
            }

        });
    </script>

</body>

</html>
