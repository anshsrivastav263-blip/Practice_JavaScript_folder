<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }
        .container{
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .number h1{
            font-size: 4rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding: 10px;
        }
        #buttons button{
            padding: 10px 20px;
            margin: 5px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        #buttons button:hover{
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter</h1>
        <div class="number">
            <h1 id="num">
                0
            </h1>
        </div>
        <div id="buttons">
            <button id="start">Start</button>
            <button id="reset">Reset</button>
            <button id="pause">Pause</button>
        </div>
    </div>
    <script>
        const number=document.querySelector("#num")
        const btns=document.querySelector("#buttons")
        let time=60
        let timer=null
        number.innerHTML=time

        const start=(e)=>{
            if(timer!==null || timer<0){
                return
            }
            if(time>0){
                timer=setInterval(()=>{
                    time--
                    number.innerHTML=time;
                },1000)
            }
        }

        const stop=(e)=>{
            if(timer===null){
                return
            }
            clearInterval(timer)
            // set setInterval id null 
            timer=null
        }

        const reset=(e)=>{
            timer=null
            time=60
            number.innerHTML=time
        }

        const updatetime=(e)=>{
            if(e.target.id==="start"){
                start(e)
            }
            if(e.target.id==="stop"){
                stop(e)
            }
            if(e.target.id==="reset"){
                reset(e)
            }
        }

        btns.addEventListener("click",updatetime)
    </script>
</body>
</html>
