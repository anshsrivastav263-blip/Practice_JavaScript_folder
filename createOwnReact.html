<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Render</title>
</head>
<body>
    <div id="root"></div>
    <script>
        const customrender=document.getElementById("root");

        const reactElement={
            type:"a",
            props:{
                href:"https://www.google.com",
                target:"_blank"
            },
            children:"click here to visit !"
        }

        function custom_render(reactElement,custom_render){
            const domelement=document.createElement(reactElement.type)

            domelement.innerText=reactElement.children;

            for(const key in reactElement.props){
                if (key==="children"){
                    continue;
                }
                domelement.setAttribute(key,reactElement.props[key])
                console.log(domelement);
                custom_render.append(domelement)
            }
        }

        custom_render(reactElement,customrender)
    </script>
</body>
</html>
