<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100vh;
        }

        body {
            background-color: royalblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(400px,90%);
            border: 10px solid white;
            border-radius: 18px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(18px);
            color: black;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.8);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: clamp(1rem, 5vw, 2rem);
        }

        .genpwd {
            width: 100%;
            outline: none;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid black;
            border-radius: 8px;
        }

        .types {
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px;
        }

        .choice {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .choice input[type="range"] {
            width: 60%;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background-color: royalblue;
            color: white;
            cursor: pointer;
        }


    </style>
</head>

<body>

    <div class="container">

        <h1>Password Generator</h1>

        <input
            type="text"
            class="genpwd"
            id="genpwd"
            readonly
        >

        <div class="types">

            <div class="choice">
                <input
                    type="range"
                    id="range"
                    min="4"
                    max="30"
                    value="12"
                >
                <p>Length: <span id="length">12</span></p>
            </div>

            <div class="choice">
                <label for="number">Number</label>
                <input type="checkbox" id="number">
            </div>

            <div class="choice">
                <label for="alphabet">Alphabet</label>
                <input type="checkbox" id="alphabet" checked>
            </div>

        </div>

        <button id="generate">Generate Password</button>

    </div>


    <script>
        const genpwd = document.querySelector("#genpwd");
        const rangeInput = document.querySelector("#range");
        const numberInput = document.querySelector("#number");
        const alphabetInput = document.querySelector("#alphabet");
        const btn = document.querySelector("#generate");
        const showlength = document.querySelector("#length");

        rangeInput.addEventListener("input",()=>{
            let length = Number(rangeInput.value);
            showlength.textContent = length;
        })

        btn.addEventListener("click", () => {

            const str = "abcdefghijklmnopqrstuvwxyz";
            const num = "123456789";

            let pwd = "";

            let length = Number(rangeInput.value);
            showlength.textContent = length;

            if (alphabetInput.checked & numberInput.checked){
                alert("You only choose one type !")
                return
            }else {

            }

            if (alphabetInput.checked) {
                for (let i = 0; i < length; i++) {
                    pwd += str[Math.floor(Math.random() * str.length)];
                }
            }

            if (numberInput.checked) {
                for (let i = 0; i < length; i++) {
                    pwd += num[Math.floor(Math.random() * num.length)];
                }
            }

            genpwd.value = pwd;
        });
    </script>

</body>

</html>
